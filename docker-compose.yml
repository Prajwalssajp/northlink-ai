version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: northlink-postgis
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: northlink_db
    ports:
      - "5432:5432"
    volumes:
      - northlink_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d northlink_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  northlink_pgdata:
    driver: local
